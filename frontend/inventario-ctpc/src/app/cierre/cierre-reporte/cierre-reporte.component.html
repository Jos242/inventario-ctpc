<div class="example-container mat-elevation-z8">
  @if (isLoadingResults) {
    <div class="example-loading-shade">
      @if (isLoadingResults) {
        <mat-spinner></mat-spinner>
      }
    </div>
  }

  <div class="example-table-container">
    <mat-form-field>
      <mat-label>Fecha</mat-label>
      <mat-select placeholder="Seleccione una ubicacion" (selectionChange)="applyFilter($event.value)">
        <mat-option *ngFor="let fechaCierre of fechaCierres" [value]="fechaCierre">
          {{ fechaCierre.fecha + ' - ' + fechaCierre.tipo }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    
    <div class="mat-elevation-z8">
      <table mat-table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="ubicacion_nombre">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Ubicación </th>
          <td mat-cell *matCellDef="let row" matTooltip="Presione para ver más información sobre este activo"> {{row.ubicacion_nombre}} </td>
        </ng-container>

        <ng-container matColumnDef="funcionario_nombre">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Funcionario </th>
          <td mat-cell *matCellDef="let row" matTooltip="Presione para ver más información sobre este activo"> {{row.funcionario_nombre}} </td>
        </ng-container>

        <ng-container matColumnDef="finalizado">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Estado </th>
          <td mat-cell *matCellDef="let row" matTooltip="Presione para ver más información sobre este activo"> {{row.finalizado == 1 ? 'Completado' : 'En progreso'}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="verDetalles(row.id)" [ngClass]="row.class" (mousedown)="onMiddleClick($event, row.id)" ></tr>
      </table>
    
      <mat-paginator [pageSizeOptions]="pageSizeOptions"  showFirstLastButtons [pageSize]="10" aria-label="Seleccione pagina de activos" ></mat-paginator>
    </div>
  </div>
</div>
