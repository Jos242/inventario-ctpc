<div class="content-container mat-elevation-z8">
  @if (isLoadingResults) {
    <div class="loading-shade">
        <mat-spinner></mat-spinner>
    </div>
  }

  <div class="boton-container">
    <a routerLink="/admin" class="go-back" matTooltip="Ir atras">
      <mat-icon>arrow_back</mat-icon>
    </a>
    <a routerLink="/adquisiciones/crear" mat-raised-button color="primary" class="boton-crear">
      <mat-icon>add_business</mat-icon>
      Crear Modo de Adquisición
    </a> 
  </div>
  
  <mat-form-field class="buscar">
    <mat-icon matTextPrefix class="search-icon">search</mat-icon>
    <mat-label>Buscar...</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Monitor, Aula 01, 6105-1234" #input>
  </mat-form-field>
  
  <div class="">
    <div class="table-container">
        <table mat-table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Descripción </th>
          <td mat-cell *matCellDef="let row"> {{row.descripcion}} </td>
        </ng-container>
    
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="verDetalles(row.id)"  matTooltip="Presione para ver más información sobre esta item"></tr>
      
        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">
            <div>
              No se han encontrado datos para "{{input.value}}"
            </div>
          </td>
        </tr>
      </table>
    </div>
    <mat-paginator [pageSizeOptions]="pageSizeOptions"  showFirstLastButtons [pageSize]="10" aria-label="Seleccione pagina de modos de adquisición" ></mat-paginator>
  </div>
</div>
