<h2 mat-dialog-title>Confirmación</h2>
<mat-dialog-content>
  {{ mensajes[data].mensaje }}
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button [mat-dialog-close]="false">{{ mensajes[data].false }}</button>
  <button mat-button [mat-dialog-close]="true">{{ mensajes[data].true }}</button>
</mat-dialog-actions>
