<h1 mat-dialog-title>Agregar Anotacion</h1>
<div mat-dialog-content>
  <form [formGroup]="myForm" class="divForm">
    <div class="container">
      <div class="row">
        <br>
        <mat-form-field appearance="outline" class="inputsForm" style="margin-top: 6px;">
          <mat-label>Descripción</mat-label>
          <textarea matInput formControlName="descripcion" placeholder="Ej. El activo con activo 1234-1234 ha..."></textarea>
        </mat-form-field>
      </div>
      <div class="row">
        <h2>Agregar anotación a varios activos</h2>
        <section class="example-section">
          <div class="row">
            <div class="col-sm-10">
              <mat-form-field appearance="outline" class="inputsForm custom-dropdown">
                <mat-label>Numero de Placa</mat-label>
                <input #activoInput matInput type="text" placeholder="Seleccione un activo" formControlName="no_identificacion" 
                [matAutocomplete]="autoActivo" #autoTriggerActivo="matAutocompleteTrigger"
                (keyup)="filterActivo(activoInput.value)" (blur)="validateActivoInput()" (keydown.enter)="onEnterPressedActivo(); activoInput.blur(); autoTriggerActivo.closePanel()">
                <span class="arrow"></span>
                <mat-autocomplete #autoActivo="matAutocomplete" [displayWith]="displayActivo">
                  <mat-option *ngFor="let activo of filteredActivos" [value]="activo">
                  {{ activo.no_identificacion }}
                  </mat-option>
                </mat-autocomplete>
                <mat-hint>Manera mediante la cual se obtuvo el activo</mat-hint>
              </mat-form-field>
            </div>
            <div class="col-sm-2">
              <button mat-flat-button color="primary" class="confirmar" style="height: 54px;" (click)="agregarActivo()">Agregar</button>
            </div>
          </div>
          <div class="selected-activos">
            <strong>Activos Seleccionados:</strong> 
            {{ activosEnLista }}
          </div>
          
        </section>
      </div>
      <br>
      <div class="row">
        <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="!myForm.valid">Agregar Anotación</button>
      </div>
    </div>
  </form>
</div>
<div mat-dialog-actions align="end">
  <button mat-flat-button color="primary" [mat-dialog-close]="false" style="margin-right: 16px;">Cerrar</button>
</div>
